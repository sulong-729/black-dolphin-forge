<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Black Dolphin Forge</title><link rel="icon" href="/icon.svg"><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0c131c;color:#e9f1f9}*{box-sizing:border-box}body{margin:0;padding:32px 24px}main{max-width:900px;margin:auto}header{display:flex;gap:15px;align-items:center;margin-bottom:28px}header img{width:54px;height:54px}h1{font-size:24px;margin:0 0 5px}small,.muted{color:#94a8bb;font-size:13px}.card{background:#131f2b;border:1px solid #293a4b;border-radius:15px;padding:22px;margin-bottom:20px}.status{display:flex;align-items:center;gap:12px}#dot{height:12px;width:12px;border-radius:50%;background:#8696a8}#dot.on{background:#55ddbb;box-shadow:0 0 14px #55ddbb55}h2{font-size:20px;margin:0}.details{display:flex;gap:24px;flex-wrap:wrap;margin:20px 0;color:#9db1c5}.details b{font-weight:500;color:#e9f1f9}button,select{font:inherit;font-size:14px;border:1px solid #3c5264;border-radius:8px;background:#1c2d3c;color:inherit;padding:10px 17px;cursor:pointer}button:hover:not(:disabled){background:#2b4153;border-color:#7c9bb0}button.primary{background:#63dfbd;color:#08271f;border-color:#63dfbd;font-weight:650}button.danger:hover:not(:disabled){border-color:#e39d93;color:#ffd0c9}button:disabled{cursor:default;opacity:.4}.actions{display:flex;gap:10px;flex-wrap:wrap}#message{min-height:20px;margin-top:16px;color:#9eb6c9;font-size:13px;white-space:pre-wrap}#message.error{color:#ffb4aa}.log-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.log-head h2{font-size:17px}pre{margin:0;background:#0a1119;border:1px solid #233646;border-radius:9px;padding:16px;min-height:260px;max-height:460px;overflow:auto;font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;color:#bcd2df;white-space:pre-wrap;overflow-wrap:anywhere}footer{color:#71879a;font-size:12px;padding:0 3px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}select{padding:8px;max-width:230px}@media(max-width:550px){body{padding:20px 14px}.card{padding:17px}.log-head{align-items:start;flex-direction:column}h1{font-size:20px}}
</style></head><body><main><header><img src="/icon.svg" alt="Black Dolphin Forge"><div><h1>Black Dolphin Forge</h1><small>Bảng điều khiển service · macOS & Windows</small></div></header><section class="card"><div class="status"><span id="dot"></span><h2 id="status">Đang kiểm tra…</h2></div><div class="details"><span>Phiên bản: <b id="version">—</b></span><span>PID: <b id="pid">—</b></span><span>Tự khởi động: <b id="auto">—</b></span></div><div class="actions"><button id="start" class="primary" disabled>Bật service</button><button id="stop" class="danger" disabled>Tắt service</button><button id="refresh">Làm mới</button></div><div id="message" role="status" aria-live="polite"></div></section><section class="card"><div class="log-head"><h2>Nhật ký</h2><select id="logs" aria-label="Chọn log"><option value="service-control.log">Hoạt động service</option><option value="service.stderr.log">Service · lỗi</option><option value="service.stdout.log">Service · output</option><option value="daemon.log">Daemon</option></select></div><pre id="log" aria-label="Nội dung log">Đang tải log…</pre></section><footer><span>Service chạy độc lập với cửa sổ điều khiển.</span><span id="updated">Chưa cập nhật</span></footer></main><script>
const fragment=location.hash.slice(1);if(fragment){sessionStorage.setItem('forge-control',fragment);history.replaceState(null,'',location.pathname);}const key=sessionStorage.getItem('forge-control');let acting=false,reading=false,last;
const $=id=>document.getElementById(id);async function api(url,options={}){const r=await fetch(url,{...options,headers:{Authorization:'Bearer '+key,'Content-Type':'application/json',...options.headers}});const data=await r.json();if(!r.ok)throw Error(data.error||'Không đọc được trạng thái');return data;}
function buttons(){ $('start').disabled=acting||!last?.installed||last.running;$('stop').disabled=acting||!last?.installed||(!last.running&&!last.autoStart);$('refresh').disabled=acting; }
async function logs(){const r=await api('/api/log?name='+encodeURIComponent($('logs').value));const box=$('log'),bottom=box.scrollTop+box.clientHeight>=box.scrollHeight-30;if(box.textContent!==r.text)box.textContent=r.text||'Chưa có log cho mục này.';if(bottom)box.scrollTop=box.scrollHeight;}
async function refresh(){if(reading||acting)return;reading=true;try{last=await api('/api/status');$('dot').className=last.running?'on':'';$('status').textContent=last.running?'Service đang chạy':last.installed?'Service đã dừng':'Service chưa được cài';$('version').textContent=last.version;$('pid').textContent=last.pid||'—';$('auto').textContent=last.installed?(last.autoStart?'Bật':'Tắt'):'Chưa cài';$('updated').textContent='Cập nhật '+new Date().toLocaleTimeString('vi-VN');if(!key)throw Error('Mở icon Black Dolphin Forge để đăng nhập cửa sổ điều khiển.');await logs();buttons();}catch(e){$('message').textContent=e.message;$('message').className='error';}finally{reading=false;}}
async function action(value){if(acting)return;acting=true;buttons();$('message').className='';$('message').textContent=value==='start'?'Đang bật service…':'Đang dừng service…';try{const r=await api('/api/action',{method:'POST',body:JSON.stringify({action:value})});if((value==='start')!==r.running)throw Error('Trạng thái chưa hoàn tất; hãy xem log và làm mới.');$('message').textContent=value==='start'?'Đã bật service và tự khởi động khi đăng nhập.':'Đã dừng service và tắt tự khởi động.';}catch(e){$('message').textContent=e.message;$('message').className='error';}finally{acting=false;await refresh();buttons();}}
$('start').onclick=()=>action('start');$('stop').onclick=()=>action('stop');$('refresh').onclick=refresh;$('logs').onchange=()=>logs().catch(e=>{$('message').textContent=e.message;});refresh();setInterval(refresh,2500);
</script></body></html>
